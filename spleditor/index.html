<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SPL 逐字歌词编辑器 · 椒盐音乐格式</title>
<meta name="description" content="面向椒盐音乐的逐字歌词编辑器，支持打点、翻译与 SPL 导出。" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('spl-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  /* ============================================================
     1. 设计令牌
     ============================================================ */
  :root {
    --bg:          #f2f3f5;
    --surface:     #f8f9fa;
    --surface-2:   #e9ebee;

    --text:        #23262b;
    --text-2:      #5b6169;
    --text-3:      #8b9199;

    --line:        rgba(35, 38, 43, 0.09);
    --line-strong: rgba(35, 38, 43, 0.16);

    --accent:      #2f6bed;
    --accent-soft: rgba(47, 107, 237, 0.09);
    --accent-line: rgba(47, 107, 237, 0.35);

    --warn-bg:     rgba(224, 169, 24, 0.10);
    --warn-fg:     #8a5c00;
    --warn-line:   rgba(224, 169, 24, 0.32);

    --glass:       rgba(242, 243, 245, 0.78);

    --shadow-sm:   0 1px 2px rgba(23, 26, 31, 0.05);
    --shadow-md:   0 2px 10px rgba(23, 26, 31, 0.06), 0 1px 2px rgba(23, 26, 31, 0.04);
    --shadow-lg:   0 18px 44px -20px rgba(23, 26, 31, 0.42);

    --ease:        cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme:  light;
  }

  html.dark {
    --bg:          #16181b;
    --surface:     #1c1f23;
    --surface-2:   #23262b;

    --text:        #e7e8ea;
    --text-2:      #a1a6ad;
    --text-3:      #737980;

    --line:        rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);

    --accent:      #6d9bff;
    --accent-soft: rgba(109, 155, 255, 0.13);
    --accent-line: rgba(109, 155, 255, 0.42);

    --warn-bg:     rgba(230, 180, 55, 0.10);
    --warn-fg:     #d6a94c;
    --warn-line:   rgba(230, 180, 55, 0.28);

    --glass:       rgba(22, 24, 27, 0.78);

    --shadow-sm:   0 1px 2px rgba(0, 0, 0, 0.28);
    --shadow-md:   0 2px 12px rgba(0, 0, 0, 0.34);
    --shadow-lg:   0 18px 46px -20px rgba(0, 0, 0, 0.8);

    color-scheme:  dark;
  }

  /* ============================================================
     2. 基础
     ============================================================ */
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 15px;
    line-height: 1.65;
    letter-spacing: 0.005em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  body.modal-open { overflow: hidden; }

  h1, h2, h3, p, ul, li { margin: 0; padding: 0; }
  ul { list-style: none; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; }

  ::selection { background: var(--accent-soft); color: var(--text); }

  .container {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ============================================================
     3. 顶栏
     ============================================================ */
  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 60;
    height: 64px;
    display: flex;
    align-items: center;
    background: var(--glass);
    -webkit-backdrop-filter: saturate(170%) blur(14px);
    backdrop-filter: saturate(170%) blur(14px);
    border-bottom: 1px solid var(--line);
    transition: background-color 0.35s ease, border-color 0.35s ease;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-right: auto;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand i {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
  }

  .icon-btn {
    width: 34px; height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    flex-shrink: 0;
    transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--text);
    background: var(--surface-2);
    border-color: var(--line-strong);
  }

  /* ============================================================
     4. 主布局
     ============================================================ */
  main {
    padding-top: 64px;
    padding-bottom: 80px;
  }

  .editor-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
    padding-top: 24px;
  }

  .panel {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    transition: background-color 0.35s ease, border-color 0.35s ease;
  }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }

  .panel-head-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-right: auto;
    min-width: 0;
  }
  .eyebrow {
    display: block;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .panel-title {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.4;
  }

  .panel-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .panel-body {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ============================================================
     5. 按钮
     ============================================================ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.2;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    white-space: nowrap;
    transition: background-color 0.18s ease, border-color 0.18s ease,
                color 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .btn i { font-size: 12px; }

  .btn-primary {
    background: var(--accent);
    color: #f6f9ff;
    box-shadow: 0 1px 2px rgba(47, 107, 237, 0.3);
  }
  .btn-primary:hover {
    filter: brightness(1.07);
    box-shadow: 0 6px 16px -8px rgba(47, 107, 237, 0.6);
  }

  .btn-ghost {
    color: var(--text);
    border-color: var(--line-strong);
    background: transparent;
  }
  .btn-ghost:hover {
    background: var(--surface-2);
    border-color: var(--text-3);
  }

  .btn-sm { padding: 7px 11px; font-size: 12.5px; }
  .btn-sm i { font-size: 11px; }

  .btn-block { width: 100%; }

  /* ============================================================
     6. 开关
     ============================================================ */
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .switch input {
    position: absolute;
    width: 0; height: 0;
    opacity: 0;
  }
  .switch .track {
    position: relative;
    width: 32px; height: 18px;
    flex-shrink: 0;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    transition: background-color 0.22s ease, border-color 0.22s ease;
  }
  .switch .thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-3);
    transition: transform 0.22s var(--ease), background-color 0.22s ease;
  }
  .switch input:checked + .track {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .switch input:checked + .track .thumb {
    transform: translateX(14px);
    background: var(--accent);
  }
  .switch-label {
    font-size: 12.5px;
    color: var(--text-2);
    white-space: nowrap;
  }

  /* ============================================================
     7. 歌词编辑区
     ============================================================ */
  .lyrics-container {
    padding: 10px 14px 16px;
    max-height: calc(100vh - 280px);
    min-height: 340px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  .lyric-line {
    padding: 12px;
    margin-bottom: 6px;
    border-radius: 8px;
    border-left: 2px solid transparent;
    scroll-margin: 20vh 0;
    transition: background-color 0.18s ease, border-color 0.18s ease;
  }
  .lyric-line:hover { background: var(--surface-2); }
  .lyric-line.current-line {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }

  .token-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    line-height: 1.4;
    min-height: 32px;
  }

  .token {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    font-size: 15px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    min-height: 32px;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    word-break: keep-all;
  }
  .token:hover { background: var(--surface-2); border-color: var(--line); }
  .lyric-line.current-line .token:hover { background: rgba(255, 255, 255, 0.5); }
  .dark .lyric-line.current-line .token:hover { background: rgba(255, 255, 255, 0.05); }

  .token.timed {
    background: var(--surface-2);
    color: var(--text-2);
  }
  .token.timed:hover { color: var(--text); }

  .token.active {
    background: var(--accent-soft) !important;
    border-color: var(--accent) !important;
    color: var(--accent) !important;
    font-weight: 600;
  }

  .line-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .line-end-time {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    font-size: 11.5px;
    color: var(--text-3);
    font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
    background: var(--surface-2);
    border-radius: 4px;
  }
  .line-end-time i { font-size: 10px; }
  .line-end-time.set {
    color: var(--accent);
    background: var(--accent-soft);
  }

  .line-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    font-size: 11.5px;
    color: var(--text-3);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 5px;
    transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
  }
  .line-btn:hover {
    color: var(--text);
    background: var(--surface-2);
    border-color: var(--line-strong);
  }
  .line-btn i { font-size: 10px; }

  /* 底部工具栏 */
  .bottom-toolbar {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .bottom-toolbar .btn { flex: 1 1 auto; min-width: 90px; padding: 11px 16px; font-size: 14px; }
  .bottom-toolbar .btn-icon-only { flex: 0 0 auto; min-width: 0; padding: 11px 14px; }

  /* ============================================================
     8. 翻译与导出面板
     ============================================================ */
  .warning-banner {
    display: none;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--warn-fg);
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    border-radius: 8px;
  }
  .warning-banner i { font-size: 12px; margin-top: 2px; }

  .spl-preview {
    width: 100%;
    min-height: 240px;
    padding: 12px 14px;
    font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.75;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    resize: vertical;
    transition: border-color 0.2s ease, background-color 0.35s ease;
  }
  .spl-preview:focus { outline: none; border-color: var(--accent); }
  .spl-preview::placeholder { color: var(--text-3); }

  .export-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .export-actions .btn { flex: 1 1 auto; }

  /* ============================================================
     9. 音频浮动面板
     ============================================================ */
  .audio-floater {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    background: var(--glass);
    -webkit-backdrop-filter: saturate(170%) blur(14px);
    backdrop-filter: saturate(170%) blur(14px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow-lg);
    transition: padding 0.22s ease, width 0.22s ease, border-radius 0.22s ease;
  }

  .audio-floater.collapsed {
    padding: 6px;
  }
  .audio-floater.collapsed .audio-body { display: none; }

  .audio-toggle {
    width: 34px; height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: none;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    transition: background-color 0.18s ease;
  }
  .audio-toggle:hover { background: rgba(47, 107, 237, 0.18); }
  .dark .audio-toggle:hover { background: rgba(109, 155, 255, 0.22); }

  .audio-body {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 320px;
  }

  .audio-btn {
    width: 34px; height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    color: var(--text-2);
    font-size: 12px;
    transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
  }
  .audio-btn:hover {
    color: var(--text);
    background: var(--surface-2);
    border-color: var(--line-strong);
  }
  .audio-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #f6f9ff;
  }
  .audio-btn.primary:hover { filter: brightness(1.07); }

  .audio-time {
    font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
    font-size: 12px;
    color: var(--text-2);
    padding: 0 4px;
    font-variant-numeric: tabular-nums;
    min-width: 82px;
    text-align: center;
    white-space: nowrap;
  }

  .audio-progress {
    flex: 1;
    min-width: 80px;
    height: 3px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--line-strong);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .audio-progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--surface);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .audio-progress::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--surface);
    cursor: pointer;
  }

  /* ============================================================
     10. Toast
     ============================================================ */
  .toast-container {
    position: fixed;
    top: 76px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1200;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    max-width: calc(100vw - 32px);
  }

  .toast-item {
    padding: 9px 16px;
    font-size: 13px;
    line-height: 1.5;
    color: #eceef1;
    background: #2b2e33;
    border-radius: 8px;
    box-shadow: 0 14px 32px -16px rgba(0, 0, 0, 0.7);
    pointer-events: auto;
    max-width: 420px;
    word-break: break-word;
    animation: toastIn 0.24s var(--ease);
  }
  .toast-item.hide { animation: toastOut 0.2s ease-in forwards; }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: none; }
    to   { opacity: 0; transform: translateY(-8px); }
  }

  /* ============================================================
     11. 快捷键提示
     ============================================================ */
  .shortcuts-hint {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 50;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', 'SF Mono', Monaco, Consolas, monospace;
    font-size: 10.5px;
    line-height: 1.7;
    color: var(--text-3);
    background: var(--glass);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 8px;
    pointer-events: none;
    max-width: 240px;
    transition: background-color 0.35s ease;
  }
  .shortcuts-hint kbd {
    display: inline-block;
    padding: 0 4px;
    margin: 0 1px;
    font-family: inherit;
    font-size: 10px;
    color: var(--text-2);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 3px;
  }

  /* ============================================================
     12. 模态框
     ============================================================ */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20, 22, 26, 0.42);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s;
  }
  .modal-mask.active { opacity: 1; visibility: visible; }

  .modal-card {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    padding: 22px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    transform: translateY(10px) scale(0.985);
    transition: transform 0.26s var(--ease), background-color 0.35s ease;
  }
  .modal-mask.active .modal-card { transform: none; }

  .modal-card.modal-wide { max-width: 820px; }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
  }
  .modal-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .modal-title i {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
  }

  .modal-input {
    width: 100%;
    padding: 11px 13px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    resize: vertical;
    min-height: 90px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.35s ease;
  }
  .modal-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    flex-shrink: 0;
  }

  .translation-input-row input {

  /* ============================================================
     13. 页脚
     ============================================================ */

    padding: 22px 0 32px;

  /* ============================================================
     14. 响应式

  @media (max-width: 960px) {
    .editor-grid { grid-template-columns: minmax(0, 1fr); }
    .lyrics-container { max-height: 52vh; }

  @media (max-width: 640px) {

<script>
(function () {
  'use strict';

  /* ============================================================
     工具函数
     ============================================================ */
  function pad(n, len) {
    return String(n).padStart(len, '0');
  }

  function formatTime(ms) {
    var totalMs = Math.floor(ms);
    if (isNaN(totalMs) || totalMs < 0) totalMs = 0;
    var totalSeconds = Math.floor(totalMs / 1000);
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;
    var milliseconds = totalMs % 1000;
    return pad(minutes, 2) + ':' + pad(seconds, 2) + '.' + pad(milliseconds, 3);
  }

  /* 分词（标点附着于前一个字词） */
  function tokenizeText(text) {
    if (!text) return [];
    var tokens = [];
    var i = 0;
    var len = text.length;

    function isWhitespace(ch) {
      return ch === ' ' || ch === '\t' || ch === '\u00A0';
    }

    while (i < len) {
      var ch = text[i];

      if (isWhitespace(ch)) {
        var spaceStr = '';
        while (i < len && isWhitespace(text[i])) {
          spaceStr += text[i];
          i++;
        }
        if (tokens.length > 0) {
          tokens[tokens.length - 1] += spaceStr;
        }
        continue;
      }

      /* 中文 */
      if (/[\u4e00-\u9fff]/.test(ch)) {
        tokens.push(ch);
        i++;
        continue;
      }

      /* 英文 / 数字 */
      if (/[a-zA-Z0-9]/.test(ch)) {
        var j = i;
        while (j < len && /[a-zA-Z0-9\-']/.test(text[j])) {
          j++;
        }
        tokens.push(text.substring(i, j));
        i = j;
        continue;
      }

      /* 标点：附着于前一个字词 */
      var punct = '';
      while (i < len &&
             !isWhitespace(text[i]) &&
             !/[a-zA-Z0-9]/.test(text[i]) &&
             !/[\u4e00-\u9fff]/.test(text[i])) {
        punct += text[i];
        i++;
      }
      if (tokens.length > 0) {
        tokens[tokens.length - 1] += punct;
      }
    }

    return tokens;
  }

  /* ============================================================
     全局状态
     ============================================================ */
  var audioElement = null;
  var currentAudioName = 'lyrics';
  var lyricsLines = [];
  var activeLineIdx = 0;
  var activeTokenIdx = -1;
  var autoLineBreak = false;

  var centerBox = null;

  /* ============================================================
     主题
     ============================================================ */
  var themeToggle = document.getElementById('themeToggle');
  var themeIcon = themeToggle ? themeToggle.querySelector('i') : null;

  function syncThemeIcon() {
    if (!themeIcon) return;
    themeIcon.className = document.documentElement.classList.contains('dark')
      ? 'fas fa-sun' : 'fas fa-moon';
  }
  syncThemeIcon();

  if (themeToggle) {
    themeToggle.addEventListener('click', function () {
      document.documentElement.classList.toggle('dark');
      try {
        localStorage.setItem('spl-theme',
          document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      } catch (e) {}
      syncThemeIcon();
    });
  }

  /* ============================================================
     Toast
     ============================================================ */
  function showToast(message, duration) {
    var container = document.getElementById('toastContainer');
    if (!container) return;
    duration = typeof duration === 'number' ? duration : 2000;

    while (container.children.length >= 4) {
      container.removeChild(container.lastChild);
    }

    var toast = document.createElement('div');
    toast.className = 'toast-item';
    toast.textContent = message;
    container.prepend(toast);

    setTimeout(function () {
      toast.classList.add('hide');
      toast.addEventListener('animationend', function () {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, { once: true });
    }, duration);
  }

  /* ============================================================
     辅助逻辑
     ============================================================ */
  function getGlobalTokenIndex(lineIdx, tokenIdx) {
    var idx = 0;
    for (var i = 0; i < lineIdx; i++) idx += lyricsLines[i].tokens.length;
    idx += tokenIdx;
    return idx;
  }

  function resetTimesFromToken(lineIdx, tokenIdx) {
    var resetCount = 0;
    for (var i = 0; i < lyricsLines.length; i++) {
      if (i < lineIdx) continue;
      var line = lyricsLines[i];
      var startToken = (i === lineIdx) ? tokenIdx + 1 : 0;
      for (var j = startToken; j < line.tokens.length; j++) {
        if (line.tokens[j].startTime !== null) {
          line.tokens[j].startTime = null;
          resetCount++;
        }
      }
    }
    if (resetCount > 0) {
      showToast('已重置后面 ' + resetCount + ' 个字词的时间戳', 1500);
    }
    updatePreview();
  }

  function seekToTokenStartMinus3Seconds(tokenStartMs) {
    if (!audioElement) {
      showToast('请先加载音频文件', 1000);
      return false;
    }
    if (tokenStartMs === null || tokenStartMs === undefined) return false;
    var seekSeconds = Math.max(0, (tokenStartMs - 3000) / 1000);
    audioElement.currentTime = seekSeconds;
    showToast('已跳转到 ' + formatTime(tokenStartMs - 3000), 1200);
    return true;
  }

  function nextUnsetTokenInLine(lineIdx, startIdx) {
    startIdx = startIdx || 0;
    var tokens = lyricsLines[lineIdx].tokens;
    for (var i = startIdx; i < tokens.length; i++) {
      if (tokens[i].startTime === null) return i;
    }
    return -1;
  }

  function createNewLineAfter(lineIdx) {
    var newLineText = '新歌词';
    var newTokens = tokenizeText(newLineText).map(function (txt) {
      return { text: txt, startTime: null };
    });
    lyricsLines.splice(lineIdx + 1, 0, {
      originalText: newLineText,
      tokens: newTokens,
      lineEndTime: null,
      _translation: null
    });
    activeLineIdx = lineIdx + 1;
    activeTokenIdx = 0;
    renderLyrics();
    showToast('已新建歌词行', 1500);
  }

  function addNewLine() {
    var newText = '新歌词';
    var tokens = tokenizeText(newText).map(function (txt) {
      return { text: txt, startTime: null };
    });
    lyricsLines.push({
      originalText: newText,
      tokens: tokens,
      lineEndTime: null,
      _translation: null
    });
    activeLineIdx = lyricsLines.length - 1;
    activeTokenIdx = 0;
    renderLyrics();
    showToast('已添加新行', 1000);
    updatePreview();
  }

  function handleAutoLineBreakIfNeeded(lineIdx) {
    if (!autoLineBreak) return false;
    var line = lyricsLines[lineIdx];
    if (!line) return false;
    var allTimed = line.tokens.every(function (t) { return t.startTime !== null; });
    if (!allTimed) return false;

    if (lineIdx === lyricsLines.length - 1) {
      createNewLineAfter(lineIdx);
    } else {
      var nextLineIdx = lineIdx + 1;
      var nextTokenIdx = nextUnsetTokenInLine(nextLineIdx, 0);
      if (nextTokenIdx === -1) nextTokenIdx = 0;
      activeLineIdx = nextLineIdx;
      activeTokenIdx = nextTokenIdx;
      renderLyrics();
      showToast('自动换行至下一行', 1000);
    }
    return true;
  }

  function markCurrentTimeToActiveToken() {
    if (!audioElement) {
      showToast('请先加载音频文件', 1500);
      return false;
    }
    if (lyricsLines.length === 0) return false;

    if (activeTokenIdx === -1 || activeTokenIdx >= lyricsLines[activeLineIdx].tokens.length) {
      var firstUnset = nextUnsetTokenInLine(activeLineIdx, 0);
      if (firstUnset === -1) {
        showToast('当前行已全部打点', 1000);
        return false;
      }
      activeTokenIdx = firstUnset;
      renderLyrics();
    }

    var line = lyricsLines[activeLineIdx];
    if (!line || activeTokenIdx >= line.tokens.length) return false;

    var currentMs = Math.floor(audioElement.currentTime * 1000);
    line.tokens[activeTokenIdx].startTime = currentMs;
    showToast('已打点: ' + line.tokens[activeTokenIdx].text + ' @ ' + formatTime(currentMs), 1200);

    var nextIdx = nextUnsetTokenInLine(activeLineIdx, activeTokenIdx + 1);
    if (nextIdx !== -1) {
      activeTokenIdx = nextIdx;
      renderLyrics();
    } else {
      activeTokenIdx = -1;
      renderLyrics();
      if (autoLineBreak) {
        handleAutoLineBreakIfNeeded(activeLineIdx);
      } else {
        showToast('当前行已全部打点', 1000);
      }
    }
    updatePreview();
    return true;
  }

  function setCurrentLineEndTime() {
    if (!audioElement) {
      showToast('请先加载音频', 1000);
      return false;
    }
    if (lyricsLines.length === 0) return false;
    var ms = Math.floor(audioElement.currentTime * 1000);
    lyricsLines[activeLineIdx].lineEndTime = ms;
    renderLyrics();
    showToast('行结束时间设为 ' + formatTime(ms), 1200);
    updatePreview();
    return true;
  }

  function moveToNextLine() {
    if (lyricsLines.length === 0) return;
    var nextLine = activeLineIdx + 1;
    if (nextLine < lyricsLines.length) {
      var newTokenIdx = nextUnsetTokenInLine(nextLine, 0);
      if (newTokenIdx === -1) newTokenIdx = 0;
      activeLineIdx = nextLine;
      activeTokenIdx = newTokenIdx;
      renderLyrics();
      showToast('切换到下一行', 1000);
    } else {
      createNewLineAfter(activeLineIdx);
      showToast('已在末尾添加新行', 1000);
    }
  }

  function endLineAndMoveToNext() {
    if (!audioElement) {
      showToast('请先加载音频文件', 1000);
      return;
    }
    if (lyricsLines.length === 0) return;
    if (setCurrentLineEndTime()) moveToNextLine();
  }

  function clearLineEndTime(lineIdx) {
    if (lyricsLines[lineIdx]) {
      lyricsLines[lineIdx].lineEndTime = null;
      renderLyrics();
      showToast('已清除行结束时间', 1000);
      updatePreview();
    }
  }

  function deleteCurrentLine(lineIdx) {
    if (lyricsLines.length <= 1) {
      showToast('至少需要保留一行歌词', 1500);
      return;
    }
    lyricsLines.splice(lineIdx, 1);
    var newIdx = Math.min(activeLineIdx, lyricsLines.length - 1);
    if (newIdx < 0) newIdx = 0;
    activeLineIdx = newIdx;
    var firstUnset = nextUnsetTokenInLine(activeLineIdx, 0);
    activeTokenIdx = firstUnset !== -1 ? firstUnset : 0;
    renderLyrics();
    showToast('已删除行', 1000);
    updatePreview();
  }

  function selectLine(lineIdx) {
    activeLineIdx = lineIdx;
    var firstUnset = nextUnsetTokenInLine(lineIdx, 0);
    activeTokenIdx = firstUnset !== -1 ? firstUnset : 0;
    renderLyrics();
    showToast('已选中行 ' + (lineIdx + 1), 800);
  }

  /* ============================================================
     编辑行文本
     ============================================================ */
  function openEditModal(lineIdx) {
    var line = lyricsLines[lineIdx];
    var modal = document.getElementById('customModal');
    var modalInput = document.getElementById('modalInput');

    document.getElementById('modalTitle').innerHTML =
      '<i class="fas fa-pen"></i>编辑歌词原文';
    modalInput.value = line.originalText;
    modal.classList.add('active');
    document.body.classList.add('modal-open');
    setTimeout(function () { modalInput.focus(); }, 100);

    document.getElementById('modalConfirmBtn').onclick = function () {
      var newText = modalInput.value.trim() || '空';
      applyEditedText(line, newText);
      closeModal('customModal');
    };

    document.getElementById('modalCancelBtn').onclick = function () {
      closeModal('customModal');
    };
  }

  function applyEditedText(line, newText) {
    var newTokensRaw = tokenizeText(newText);
    var oldTokens = line.tokens;

    var newTokens = newTokensRaw.map(function (txt, idx) {
      var matchedTime = null;
      if (idx < oldTokens.length && oldTokens[idx].text === txt) {
        matchedTime = oldTokens[idx].startTime;
      } else {
        var found = oldTokens.find(function (ot) {
          if (ot.text === txt) return true;
          var otTrimmed = ot.text.replace(/\s+$/g, '');
          var txtTrimmed = txt.replace(/\s+$/g, '');
          if (otTrimmed === txtTrimmed) return true;
          if (txt.indexOf(ot.text) === 0 && txt.slice(ot.text.length).trim() === '') return true;
          return false;
        });
        if (found) matchedTime = found.startTime;
      }
      return { text: txt, startTime: matchedTime };
    });

    line.originalText = newText;
    line.tokens = newTokens;

    if (activeTokenIdx >= newTokens.length) {
      activeTokenIdx = Math.max(0, newTokens.length - 1);
    }

    renderLyrics();
    updatePreview();
    showToast('歌词已更新', 1000);
  }

  /* ============================================================
     导入歌词
     ============================================================ */
  function openImportModal() {
    var modal = document.getElementById('customModal');
    var modalInput = document.getElementById('modalInput');

    document.getElementById('modalTitle').innerHTML =
      '<i class="fas fa-file-import"></i>导入歌词（每行一句）';
    modalInput.value = lyricsLines.map(function (l) { return l.originalText; }).join('\n');
    modal.classList.add('active');
    document.body.classList.add('modal-open');
    setTimeout(function () { modalInput.focus(); }, 100);

    document.getElementById('modalConfirmBtn').onclick = function () {
      var rawText = modalInput.value;
      var linesArr = rawText.split(/\r?\n/).filter(function (l) { return l.trim().length > 0; });

      if (linesArr.length === 0) {
        showToast('至少输入一行歌词', 1000);
        closeModal('customModal');
        return;
      }

      var newLyrics = linesArr.map(function (lineText) {
        var tokens = tokenizeText(lineText).map(function (txt) {
          return { text: txt, startTime: null };
        });
        return {
          originalText: lineText,
          tokens: tokens,
          lineEndTime: null,
          _translation: null
        };
      });

      lyricsLines = newLyrics;
      activeLineIdx = 0;
      var firstUnset = nextUnsetTokenInLine(0, 0);
      activeTokenIdx = firstUnset !== -1 ? firstUnset : 0;

      renderLyrics();
      updatePreview();
      closeModal('customModal');
      showToast('导入成功，共 ' + lyricsLines.length + ' 行', 1500);
    };

    document.getElementById('modalCancelBtn').onclick = function () {
      closeModal('customModal');
    };
  }

  /* ============================================================
     模态框
     ============================================================ */
  function closeModal(id) {
    var modal = document.getElementById(id);
    if (!modal) return;
    modal.classList.remove('active');
    if (!document.querySelector('.modal-mask.active')) {
      document.body.classList.remove('modal-open');
    }
  }

  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      closeModal(btn.dataset.close);
    });
  });

  document.querySelectorAll('.modal-mask').forEach(function (mask) {
    mask.addEventListener('click', function (e) {
      if (e.target === mask) closeModal(mask.id);
    });
  });

  /* ============================================================
     翻译
     ============================================================ */
  function syncScrollLeftToRight() {
    var left = document.getElementById('translationLyricsList');
    var right = document.getElementById('translationInputContainer');
    right.scrollTop = left.scrollTop;
  }

  function syncScrollRightToLeft() {
    var left = document.getElementById('translationLyricsList');
    var right = document.getElementById('translationInputContainer');
    left.scrollTop = right.scrollTop;
  }

  function openTranslationModal() {
    var modal = document.getElementById('translationModal');
    var lyricsList = document.getElementById('translationLyricsList');
    var inputContainer = document.getElementById('translationInputContainer');

    lyricsList.innerHTML = '';
    inputContainer.innerHTML = '';

    lyricsLines.forEach(function (line, idx) {
      var div = document.createElement('div');
      div.className = 'lyric-line-item';
      div.textContent = (idx + 1) + '. ' + line.originalText;
      lyricsList.appendChild(div);
    });

    lyricsLines.forEach(function (line, idx) {
      var row = document.createElement('div');
      row.className = 'translation-input-row';
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '输入翻译…';
      input.value = line._translation ? line._translation.text : '';
      input.dataset.index = idx;
      row.appendChild(input);
      inputContainer.appendChild(row);
    });

    lyricsList.removeEventListener('scroll', syncScrollLeftToRight);
    inputContainer.removeEventListener('scroll', syncScrollRightToLeft);
    lyricsList.addEventListener('scroll', syncScrollLeftToRight);
    inputContainer.addEventListener('scroll', syncScrollRightToLeft);

    modal.classList.add('active');
    document.body.classList.add('modal-open');
  }

  function applyTranslationFromModal() {
    var inputs = document.querySelectorAll('#translationInputContainer input');
    inputs.forEach(function (input, idx) {
      var val = input.value.trim();
      if (val) {
        var firstToken = null;
        for (var i = 0; i < lyricsLines[idx].tokens.length; i++) {
          if (lyricsLines[idx].tokens[i].startTime !== null) {
            firstToken = lyricsLines[idx].tokens[i];
            break;
          }
        }
        if (firstToken) {
          lyricsLines[idx]._translation = { text: val, time: firstToken.startTime };
        } else {
          lyricsLines[idx]._translation = null;
          showToast('第 ' + (idx + 1) + ' 行无已打点字词，跳过翻译', 1000);
        }
      } else {
        lyricsLines[idx]._translation = null;
      }
    });

    renderLyrics();
    updatePreview();
    showToast('翻译已应用', 1200);
    closeModal('translationModal');
  }

  /* ============================================================
     渲染歌词
     ============================================================ */
  function renderLyrics() {
    var container = document.getElementById('lyricsContainer');
    if (!container) return;
    container.innerHTML = '';

    for (var i = 0; i < lyricsLines.length; i++) {
      var line = lyricsLines[i];
      var lineDiv = document.createElement('div');
      lineDiv.className = 'lyric-line' + (i === activeLineIdx ? ' current-line' : '');
      lineDiv.dataset.lineIndex = i;

      var tokensDiv = document.createElement('div');
      tokensDiv.className = 'token-list';

      line.tokens.forEach(function (token, tIdx) {
        var span = document.createElement('span');
        span.className = 'token';
        if (token.startTime !== null) span.classList.add('timed');
        if (activeTokenIdx >= 0 && activeLineIdx === i && activeTokenIdx === tIdx) {
          span.classList.add('active');
        }
        span.textContent = token.text;
        span.dataset.lineIdx = i;
        span.dataset.tokenIdx = tIdx;

        span.addEventListener('click', function (e) {
          e.stopPropagation();
          handleTokenClick(i, tIdx);
        });

        tokensDiv.appendChild(span);
      });

      lineDiv.appendChild(tokensDiv);

      var actionsDiv = document.createElement('div');
      actionsDiv.className = 'line-actions';

      var endTimeStr = line.lineEndTime ? formatTime(line.lineEndTime) : '未设置';
      var endTimeCls = line.lineEndTime ? 'line-end-time set' : 'line-end-time';

      actionsDiv.innerHTML =
        '<span class="' + endTimeCls + '"><i class="fas fa-clock"></i>' + endTimeStr + '</span>' +
        '<button class="line-btn" data-action="clearEnd" data-line="' + i + '" type="button"><i class="fas fa-eraser"></i>清除结束时间</button>' +
        '<button class="line-btn" data-action="delete" data-line="' + i + '" type="button"><i class="fas fa-trash-can"></i>删除此行</button>' +
        '<button class="line-btn" data-action="select" data-line="' + i + '" type="button"><i class="fas fa-crosshairs"></i>选中行</button>' +
        '<button class="line-btn" data-action="edit" data-line="' + i + '" type="button"><i class="fas fa-pen"></i>编辑原文</button>';

      lineDiv.appendChild(actionsDiv);
      container.appendChild(lineDiv);
    }

    container.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var action = btn.dataset.action;
        var lineIdx = parseInt(btn.dataset.line, 10);
        if (action === 'clearEnd') clearLineEndTime(lineIdx);
        else if (action === 'delete') deleteCurrentLine(lineIdx);
        else if (action === 'select') selectLine(lineIdx);
        else if (action === 'edit') openEditModal(lineIdx);
      });
    });

    if (lyricsLines.length > 0) {
      var currentLineEl = container.querySelector('.lyric-line[data-line-index="' + activeLineIdx + '"]');
      if (currentLineEl) {
        currentLineEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      }
    }
  }

  function handleTokenClick(lineIdx, tokenIdx) {
    var currentGlobal = getGlobalTokenIndex(activeLineIdx, activeTokenIdx >= 0 ? activeTokenIdx : 0);
    var clickedGlobal = getGlobalTokenIndex(lineIdx, tokenIdx);

    if (activeTokenIdx >= 0 && clickedGlobal < currentGlobal) {
      resetTimesFromToken(lineIdx, tokenIdx);
    }

    activeLineIdx = lineIdx;
    activeTokenIdx = tokenIdx;
    renderLyrics();

    var tokenData = lyricsLines[lineIdx].tokens[tokenIdx];
    if (tokenData.startTime !== null && audioElement) {
      seekToTokenStartMinus3Seconds(tokenData.startTime);
    } else if (tokenData.startTime === null) {
      showToast('「' + tokenData.text + '」尚未打点，无法跳转', 1000);
    }
  }

  /* ============================================================
     初始化默认歌词
     ============================================================ */
  function initDefaultLyrics() {
    var defaultText = '你好椒盐音乐';
    var tokens = tokenizeText(defaultText).map(function (txt) {
      return { text: txt, startTime: null };
    });
    lyricsLines = [{
      originalText: defaultText,
      tokens: tokens,
      lineEndTime: null,
      _translation: null
    }];
    activeLineIdx = 0;
    activeTokenIdx = 0;
    renderLyrics();
    updatePreview();
  }

  /* ============================================================
     音频
     ============================================================ */
  function setupAudio(file) {
    if (audioElement) {
      audioElement.pause();
      audioElement.src = '';
    }
    var url = URL.createObjectURL(file);
    audioElement = new Audio(url);
    currentAudioName = file.name.replace(/\.[^/.]+$/, '');

    audioElement.addEventListener('loadedmetadata', function () {
      var pb = document.getElementById('progressBar');
      if (pb) pb.max = audioElement.duration;
    });

    audioElement.addEventListener('timeupdate', function () {
      if (!audioElement) return;
      var cur = audioElement.currentTime;
      var pb = document.getElementById('progressBar');
      if (pb) pb.value = cur;
      var td = document.getElementById('timeDisplay');
      if (td) td.textContent = formatTime(Math.floor(cur * 1000));
    });

    audioElement.addEventListener('ended', function () {
      var btn = document.getElementById('playPauseBtn');
      if (btn) btn.innerHTML = '<i class="fas fa-play"></i>';
    });

    showToast('已加载 ' + file.name, 1500);
  }

  /* ============================================================
     生成 SPL
     ============================================================ */
  function generateSPLText() {
    var output = '';
    for (var i = 0; i < lyricsLines.length; i++) {
      var line = lyricsLines[i];
      var lastTime = null;
      var lineTokensStr = '';

      for (var j = 0; j < line.tokens.length; j++) {
        var token = line.tokens[j];
        var timeMs = token.startTime;
        if (timeMs === null) timeMs = (lastTime !== null) ? lastTime + 10 : 0;
        timeMs = Math.floor(timeMs);
        lastTime = timeMs;
        lineTokensStr += '[' + formatTime(timeMs) + ']' + token.text;
      }

      var lineEndStr = line.lineEndTime !== null
        ? '[' + formatTime(Math.floor(line.lineEndTime)) + ']'
        : '';

      output += lineTokensStr + lineEndStr + '\n';

      if (line._translation && line._translation.text) {
        var transTime = line._translation.time !== null ? Math.floor(line._translation.time) : 0;
        output += '[' + formatTime(transTime) + ']' + line._translation.text + '\n';
      }
    }
    return output.trim();
  }

  function hasAnyUnsetToken() {
    return lyricsLines.some(function (line) {
      return line.tokens.some(function (t) { return t.startTime === null; });
    });
  }

  function updatePreview() {
    var preview = document.getElementById('splPreview');
    if (preview) preview.value = generateSPLText();
    var banner = document.getElementById('warningBanner');
    if (banner) banner.style.display = hasAnyUnsetToken() ? 'flex' : 'none';
  }

  /* ============================================================
     键盘
     ============================================================ */
  function isInputFocused() {
    var active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
      return true;
    }
    return !!(document.querySelector('.modal-mask.active'));
  }

  function handleKeydown(e) {
    if (isInputFocused()) return;
    var key = e.key;
    var ctrl = e.ctrlKey || e.metaKey;

    if (key === ' ' || key === 'Space') {
      e.preventDefault();
      var pb = document.getElementById('playPauseBtn');
      if (pb) pb.click();
      return;
    }

    if (key === 'ArrowLeft') {
      e.preventDefault();
      if (audioElement) {
        var stepL = ctrl ? 1 : 5;
        audioElement.currentTime = Math.max(0, audioElement.currentTime - stepL);
        showToast('后退 ' + stepL + ' 秒', 800);
      } else {
        showToast('未加载音频', 800);
      }
      return;
    }

    if (key === 'ArrowRight') {
      e.preventDefault();
      if (audioElement) {
        var stepR = ctrl ? 1 : 5;
        audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + stepR);
        showToast('前进 ' + stepR + ' 秒', 800);
      } else {
        showToast('未加载音频', 800);
      }
      return;
    }

    if (key === 't' || key === 'T' || key === 'r' || key === 'R' || key === '1') {
      e.preventDefault();
      markCurrentTimeToActiveToken();
      return;
    }

    if (key === 'm' || key === 'M') {
      e.preventDefault();
      var mb = document.getElementById('bottomEndBreakBtn');
      if (mb) mb.click();
      return;
    }

    if (key === 'n' || key === 'N') {
      e.preventDefault();
      var ab = document.getElementById('addLineBtn');
      if (ab) ab.click();
      return;
    }

    if (key === 'i' || key === 'I') {
      e.preventDefault();
      var ib = document.getElementById('importLyricsBtn');
      if (ib) ib.click();
      return;
    }

    if (key === 'a' || key === 'A') {
      e.preventDefault();
      var chk = document.getElementById('autoLineBreakCheckbox');
      if (!chk) return;
      chk.checked = !chk.checked;
      chk.dispatchEvent(new Event('change'));
      showToast('自动换行: ' + (chk.checked ? '开启' : '关闭'), 1000);
      return;
    }

    if (key === 'g' || key === 'G') {
      e.preventDefault();
      var gb = document.getElementById('generatePreviewBtn');
      if (gb) gb.click();
      return;
    }

    if (key === 'c' || key === 'C') {
      e.preventDefault();
      var cb = document.getElementById('copyLrcBtn');
      if (cb) cb.click();
      return;
    }

    if (key === 'd' || key === 'D') {
      e.preventDefault();
      var db = document.getElementById('downloadLrcBtn');
      if (db) db.click();
      return;
    }
  }

  /* ============================================================
     事件绑定
     ============================================================ */

  /* 音频 */
  document.getElementById('selectAudioBtn').addEventListener('click', function () {
    document.getElementById('audioFileInput').click();
  });

  document.getElementById('audioFileInput').addEventListener('change', function (e) {
    if (e.target.files && e.target.files.length) setupAudio(e.target.files[0]);
  });

  document.getElementById('playPauseBtn').addEventListener('click', function () {
    if (!audioElement) {
      showToast('请先选择音频文件', 1000);
      return;
    }
    var btn = this;
    if (audioElement.paused) {
      audioElement.play().catch(function () {
        showToast('自动播放被阻止，请手动点击播放', 1500);
      });
      btn.innerHTML = '<i class="fas fa-pause"></i>';
    } else {
      audioElement.pause();
      btn.innerHTML = '<i class="fas fa-play"></i>';
    }
  });

  document.getElementById('progressBar').addEventListener('input', function (e) {
    if (audioElement) audioElement.currentTime = parseFloat(e.target.value);
  });

  /* 音频折叠 */
  document.getElementById('audioToggleBtn').addEventListener('click', function () {
    var floater = document.getElementById('audioFloater');
    floater.classList.toggle('collapsed');
  });

  /* 编辑 / 导入 */
  document.getElementById('importLyricsBtn').addEventListener('click', openImportModal);

  /* 打点 / 换行 / 新增 */
  document.getElementById('bottomMarkBtn').addEventListener('click', markCurrentTimeToActiveToken);
  document.getElementById('bottomEndBreakBtn').addEventListener('click', endLineAndMoveToNext);
  document.getElementById('addLineBtn').addEventListener('click', addNewLine);

  /* 自动换行 */
  document.getElementById('autoLineBreakCheckbox').addEventListener('change', function (e) {
    autoLineBreak = e.target.checked;
  });

  /* 翻译 */
  document.getElementById('openTranslationModalBtn').addEventListener('click', openTranslationModal);
  document.getElementById('translationCancelBtn').addEventListener('click', function () {
    closeModal('translationModal');
  });
  document.getElementById('translationConfirmBtn').addEventListener('click', applyTranslationFromModal);

  /* 导出 */
  document.getElementById('generatePreviewBtn').addEventListener('click', updatePreview);

  document.getElementById('copyLrcBtn').addEventListener('click', function () {
    navigator.clipboard.writeText(generateSPLText()).then(function () {
      showToast('已复制 SPL 歌词', 1200);
    }).catch(function () {
      showToast('复制失败', 1200);
    });
  });

  document.getElementById('downloadLrcBtn').addEventListener('click', function () {
    var content = generateSPLText();
    var fileName = currentAudioName ? currentAudioName + '.lrc' : 'lyrics.lrc';
    var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    showToast('下载成功', 1200);
  });

  window.addEventListener('keydown', handleKeydown);

  /* ============================================================
     启动
     ============================================================ */
  document.addEventListener('DOMContentLoaded', function () {
    initDefaultLyrics();
    autoLineBreak = false;
    var chk = document.getElementById('autoLineBreakCheckbox');
    if (chk) chk.checked = false;
  });

})();
</script>
</body>
</html>

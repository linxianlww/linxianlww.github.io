<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>歌词翻译工具</title>
<meta name="description" content="面向歌词翻填创作者的翻译辅助工具。" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('ltt-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  /* ============================================================
     1. 设计令牌
     ============================================================ */
  :root {
    --bg:          #f2f3f5;
    --surface:     #f8f9fa;
    --surface-2:   #e9ebee;

    --text:        #23262b;
    --text-2:      #5b6169;
    --text-3:      #8b9199;

    --line:        rgba(35, 38, 43, 0.09);
    --line-strong: rgba(35, 38, 43, 0.16);

    --accent:      #2f6bed;
    --accent-soft: rgba(47, 107, 237, 0.09);

    --danger:      #b3261e;
    --danger-soft: rgba(179, 38, 30, 0.08);

    --glass:       rgba(242, 243, 245, 0.78);

    --shadow-sm:   0 1px 2px rgba(23, 26, 31, 0.05);
    --shadow-md:   0 2px 10px rgba(23, 26, 31, 0.06), 0 1px 2px rgba(23, 26, 31, 0.04);
    --shadow-lg:   0 18px 44px -20px rgba(23, 26, 31, 0.42);

    --ease:        cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme:  light;
  }

  html.dark {
    --bg:          #16181b;
    --surface:     #1c1f23;
    --surface-2:   #23262b;

    --text:        #e7e8ea;
    --text-2:      #a1a6ad;
    --text-3:      #737980;

    --line:        rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);

    --accent:      #6d9bff;
    --accent-soft: rgba(109, 155, 255, 0.13);

    --danger:      #ff8a80;
    --danger-soft: rgba(255, 138, 128, 0.12);

    --glass:       rgba(22, 24, 27, 0.78);

    --shadow-sm:   0 1px 2px rgba(0, 0, 0, 0.28);
    --shadow-md:   0 2px 12px rgba(0, 0, 0, 0.34);
    --shadow-lg:   0 18px 46px -20px rgba(0, 0, 0, 0.8);

    color-scheme:  dark;
  }

  /* ============================================================
     2. 基础
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 15px;
    line-height: 1.65;
    letter-spacing: 0.005em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  body.modal-open,
  body.drawer-open { overflow: hidden; }

  h1, h2, h3, h4, p, ul, li { margin: 0; padding: 0; }
  ul { list-style: none; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }

  ::selection { background: var(--accent-soft); color: var(--text); }

  .container {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ============================================================
     3. 顶栏
     ============================================================ */
  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 60;
    height: 64px;
    display: flex;
    align-items: center;
    background: var(--glass);
    -webkit-backdrop-filter: saturate(170%) blur(14px);
    backdrop-filter: saturate(170%) blur(14px);
    border-bottom: 1px solid var(--line);
    transition: background-color 0.35s ease, border-color 0.35s ease;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .brand i {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12px;
  }

  .top-nav { display: none; gap: 2px; margin-left: 14px; }
  .top-nav a {
    padding: 6px 13px;
    font-size: 13.5px;
    color: var(--text-2);
    border-radius: 7px;
    transition: color 0.2s ease, background-color 0.2s ease;
  }
  .top-nav a:hover { color: var(--text); background: var(--surface-2); }
  .top-nav a.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }

  /* ============================================================
     4. 通用控件
     ============================================================ */
  .icon-btn {
    width: 34px; height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  }
  .icon-btn:hover {
    color: var(--text);
    background: var(--surface-2);
    border-color: var(--line-strong);
  }
  .icon-btn.small { width: 28px; height: 28px; border-radius: 7px; font-size: 11.5px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.2s ease, border-color 0.2s ease,
                color 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .btn i { font-size: 12px; }

  .btn-primary { background: var(--accent); color: #f6f9ff; }
  .btn-primary:hover { filter: brightness(1.07); box-shadow: 0 8px 20px -10px rgba(47, 107, 237, 0.7); }

  .btn-ghost { border-color: var(--line-strong); color: var(--text); }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--text-3); }

  .btn-danger { background: var(--danger); color: #fff8f7; }
  .btn-danger:hover { filter: brightness(1.08); }

  .btn-sm { padding: 7px 12px; font-size: 13px; }

  /* ============================================================
     5. 主内容
     ============================================================ */
  main {
    flex: 1 0 auto;
    padding-top: 64px;
  }

  .tab-content { display: none; }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin: 40px 0 22px;
    flex-wrap: wrap;
  }
  .eyebrow {
    display: block;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .page-title {
    margin-top: 6px;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.35;
  }
  .page-count {
    font-size: 12.5px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
    gap: 14px;
    padding-bottom: 60px;
  }

  .project-card {
    position: relative;
    padding: 18px;
    min-height: 122px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
  }
  .project-card:hover {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .project-card.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .project-title {
    padding-right: 28px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.45;
    word-break: break-word;
  }
  .project-sub {
    margin-top: 4px;
    font-size: 12.5px;
    color: var(--text-3);
    word-break: break-word;
  }
  .project-preview {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  /* 卡片复选框 */
  .card-check {
    position: absolute;
    top: 14px; right: 14px;
    display: flex;
    cursor: pointer;
  }
  .card-check input {
    position: absolute;
    width: 0; height: 0;
    opacity: 0;
  }
  .card-check .box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    background: var(--bg);
    color: transparent;
    font-size: 8px;
    transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }
  .card-check:hover .box { border-color: var(--text-3); }
  .card-check input:checked + .box {
    background: var(--accent);
    border-color: var(--accent);
    color: #f6f9ff;
  }

  /* 空状态 */
  .empty {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 72px 24px;
    text-align: center;
    color: var(--text-3);
    background: var(--surface);
    border: 1px dashed var(--line-strong);
    border-radius: 12px;
    margin-bottom: 60px;
  }
  .empty i {
    font-size: 24px;
    margin-bottom: 14px;
    opacity: 0.65;
  }
  .empty p { font-size: 13.5px; }
  .empty p.hint { margin-top: 4px; font-size: 12.5px; opacity: 0.85; }

  /* ============================================================
     6. 编辑页
     ============================================================ */
  .editor-bar {
    position: sticky;
    top: 64px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 14px 0;
    margin-bottom: 6px;
    background: var(--glass);
    -webkit-backdrop-filter: saturate(170%) blur(14px);
    backdrop-filter: saturate(170%) blur(14px);
    border-bottom: 1px solid var(--line);
  }

  .editor-info { min-width: 0; }
  .editor-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.4;
    word-break: break-word;
  }
  .editor-meta {
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--text-3);
    word-break: break-word;
  }

  .editor-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-left: auto;
  }

  /* 开关 */
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    user-select: none;
  }
  .switch input {
    position: absolute;
    width: 0; height: 0;
    opacity: 0;
  }
  .switch .track {
    position: relative;
    width: 36px; height: 20px;
    flex-shrink: 0;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface-2);
    transition: background-color 0.24s ease, border-color 0.24s ease;
  }
  .switch .thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--text-3);
    transition: transform 0.24s var(--ease), background-color 0.24s ease;
  }
  .switch input:checked + .track {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .switch input:checked + .track .thumb {
    transform: translateX(16px);
    background: var(--accent);
  }
  .switch-label {
    font-size: 13px;
    color: var(--text-2);
    white-space: nowrap;
  }

  .lyrics { padding: 22px 0 120px; }

  .lyric-line {
    margin-bottom: 12px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    transition: border-color 0.22s ease;
  }
  .lyric-line:hover { border-color: var(--line-strong); }

  .lyric-original {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
  }
  .lyric-original.hidden { display: none !important; }

  .lyric-text {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--text);
    word-break: break-word;
  }

  .reference-trans {
    display: none;
    margin-top: 10px;
    padding: 9px 13px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-2);
    background: var(--surface-2);
    border-left: 2px solid var(--accent);
    border-radius: 0 7px 7px 0;
    word-break: break-word;
  }

  .translation-input {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 11px 13px;
    font: inherit;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    resize: none;
    min-height: 46px;
    overflow: hidden;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.35s ease;
  }
  .translation-input::placeholder { color: var(--text-3); }
  .translation-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ============================================================
     7. FAB / 批量操作栏 / 提示
     ============================================================ */
  .fab {
    position: fixed;
    right: 26px; bottom: 26px;
    z-index: 140;
    display: none;
  }
  .fab button {
    width: 52px; height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #f6f9ff;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 12px 28px -12px rgba(47, 107, 237, 0.85);
    transition: transform 0.22s var(--ease), box-shadow 0.22s ease, filter 0.22s ease;
  }
  .fab button:hover {
    transform: translateY(-2px);
    filter: brightness(1.06);
    box-shadow: 0 16px 32px -12px rgba(47, 107, 237, 0.9);
  }
  .fab button:active { transform: translateY(0); }

  .batch-bar {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 150;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    max-width: calc(100vw - 32px);
    padding: 8px 10px 8px 16px;
    background: #2b2e33;
    color: #e8eaed;
    border-radius: 10px;
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.7);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 16px);
    transition: opacity 0.24s ease, transform 0.24s var(--ease), visibility 0.24s;
  }
  .batch-bar.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }
  .batch-count {
    margin-right: 6px;
    font-size: 13px;
    white-space: nowrap;
    color: #e8eaed;
  }
  .batch-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    font-size: 13px;
    color: #e8eaed;
    background: transparent;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 0.18s ease;
  }
  .batch-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .batch-btn i { font-size: 11px; }
  .batch-btn.danger { color: #ff9b90; }
  .batch-btn.danger:hover { background: rgba(255, 155, 144, 0.13); }

  .toast {
    position: fixed;
    left: 50%;
    top: 80px;
    z-index: 300;
    max-width: calc(100vw - 40px);
    padding: 11px 18px;
    font-size: 13.5px;
    color: #eceef1;
    background: #2b2e33;
    border-radius: 9px;
    box-shadow: 0 14px 34px -16px rgba(0, 0, 0, 0.7);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -12px);
    transition: opacity 0.24s ease, transform 0.24s var(--ease), visibility 0.24s;
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  /* ============================================================
     8. 对话框
     ============================================================ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20, 22, 26, 0.42);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s;
  }
  .modal-backdrop.open { opacity: 1; visibility: visible; }

  .modal {
    width: 100%;
    max-width: 620px;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    transform: translateY(10px) scale(0.985);
    transition: transform 0.26s var(--ease);
  }
  .modal-backdrop.open .modal { transform: none; }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 24px 0;
  }
  .modal-head h3 {
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
  }
  .modal-body p {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-2);
  }
  .modal-foot {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 0 24px 22px;
  }

  /* 表单 */
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
  }
  .field { min-width: 0; }
  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
  }
  .field input,
  .field textarea,
  select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.35s ease;
  }
  .field textarea { resize: none; min-height: 46px; overflow: hidden; line-height: 1.7; }
  .field input::placeholder,
  .field textarea::placeholder { color: var(--text-3); }
  .field input:focus,
  .field textarea:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '';
    position: absolute;
    right: 14px;
    top: 50%;
    width: 7px; height: 7px;
    border-right: 1.5px solid var(--text-3);
    border-bottom: 1.5px solid var(--text-3);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 34px;
    cursor: pointer;
  }

  /* ============================================================
     9. 抽屉
     ============================================================ */
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 90;
    width: 264px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    transform: translateX(-100%);
    transition: transform 0.28s var(--ease);
  }
  .drawer.open { transform: none; }

  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 64px;
    padding: 0 16px 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-brand {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .drawer-nav { padding: 10px; }
  .drawer-link {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 13px;
    font-size: 13.5px;
    color: var(--text-2);
    border-radius: 8px;

  }
  .drawer-link i { width: 16px; text-align: center; font-size: 12.5px; }
  .drawer-link:hover { color: var(--text); background: var(--surface-2); }
  .drawer-link.active { color: var(--accent); background: var(--accent-soft); font-weight: 500; }

  .drawer-mask {
    position: fixed;
    inset: 0;
    z-index: 85;
    background: rgba(20, 22, 26, 0.4);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0.28s;
  }
  .drawer-mask.show { opacity: 1; visibility: visible; }

  /* ============================================================
     10. 页脚
     ============================================================ */
  .site-footer {
    flex-shrink: 0;
    padding: 22px 0 28px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 12.5px;
    color: var(--text-3);
  }

  /* ============================================================
     11. 响应式
     ============================================================ */
  @media (min-width: 860px) {
    .top-nav { display: flex; }
    .nav-toggle { display: none; }
  }

  @media (max-width: 859px) {
    .nav-toggle { display: inline-flex; }
    .top-nav { display: none; }
  }

  @media (max-width: 640px) {
    .container { padding: 0 18px; }

    .brand span { display: inline; }

  /* ============================================================

<script>
(function () {
  'use strict';

  /* ============================================================
     全局状态
     ============================================================ */
  var AppState = {
    currentTab: 'home',
    currentProjectKey: null,
    currentProjectData: null,
    originalTranslations: null,
    selectedItems: new Set(),
    autoSaveTimer: null,
    isEditing: false
  };

  var LANG_MAP = {
    中文: 'zh-CN',
    英语: 'en',
    日语: 'ja',
    韩语: 'ko',
    其他: 'auto'
  };

  /* ============================================================
     通用工具
     ============================================================ */
  function generateTimestamp() {
    var now = new Date();
    return now.getFullYear().toString() +
      String(now.getMonth() + 1).padStart(2, '0') +
      String(now.getDate()).padStart(2, '0') +
      String(now.getHours()).padStart(2, '0') +
      String(now.getMinutes()).padStart(2, '0') +
      String(now.getSeconds()).padStart(2, '0');
  }

  function validateProjectData(data) {
    if (!data || typeof data !== 'object') return false;
    if (!data.meta || typeof data.meta !== 'object') return false;
    if (!data.meta.title || !data.meta.artist || !data.meta.orilang || !data.meta.translang) return false;
    if (!Array.isArray(data.ori) || !Array.isArray(data.trans)) return false;
    if (data.ori.length !== data.trans.length) return false;
    return true;
  }

  function getAllProjects(prefix) {
    var projects = [];
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key && key.indexOf(prefix) === 0) {
        try {
          var data = JSON.parse(localStorage.getItem(key));
          if (validateProjectData(data)) {
            projects.push({ key: key, data: data });
          }
        } catch (e) {
          console.error('Invalid project data:', key);
        }
      }
    }
    return projects;
  }

  function saveProject(key, data) {
    try {
      localStorage.setItem(key, JSON.stringify(data));
      return true;
    } catch (e) {
      if (e.name === 'QuotaExceededError') {
        showToast('存储空间已满，请清理无用项目');
      } else {
        showToast('保存失败：' + e.message);
      }
      return false;
    }
  }

  function moveProject(oldKey, newPrefix) {
    var data = localStorage.getItem(oldKey);
    if (!data) return null;
    var timestamp = oldKey.split('_').pop();
    var newKey = newPrefix + '_' + timestamp;
    try {
      localStorage.setItem(newKey, data);
      localStorage.removeItem(oldKey);
      return newKey;
    } catch (e) {
      showToast('操作失败：' + e.message);
      return null;
    }
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }

  function showToast(message, duration) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function () {
      el.classList.remove('show');
    }, typeof duration === 'number' ? duration : 2600);
  }

  function downloadFile(filename, content, type) {
    var blob = new Blob([content], { type: type || 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function safeFilename(name) {
    return String(name).replace(/[\\/:*?"<>|]/g, '');
  }

  /* ============================================================
     对话框
     ============================================================ */
  function openModal(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.add('open');
    document.body.classList.add('modal-open');
  }

  function closeModal(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('open');
    if (!document.querySelector('.modal-backdrop.open')) {
      document.body.classList.remove('modal-open');
    }
  }

  var confirmCallback = null;

  function showConfirm(title, message, onConfirm) {
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-message').textContent = message;
    confirmCallback = onConfirm;
    openModal('confirm-modal');
  }

  /* ============================================================
     抽屉
     ============================================================ */
  function openDrawer() {
    var d = document.getElementById('drawer');
    var m = document.getElementById('drawerMask');
    if (d) d.classList.add('open');
    if (m) m.classList.add('show');
    document.body.classList.add('drawer-open');
  }

  function closeDrawer() {
    var d = document.getElementById('drawer');
    var m = document.getElementById('drawerMask');
    if (d) d.classList.remove('open');
    if (m) m.classList.remove('show');
    document.body.classList.remove('drawer-open');
  }

  /* ============================================================
     原文显示 / 隐藏
     ============================================================ */
  function toggleOriginalVisibility() {
    var checked = document.getElementById('toggle-original').checked;
    document.querySelectorAll('.lyric-original').forEach(function (el) {
      el.classList.toggle('hidden', !checked);
    });
  }

  /* ============================================================
     导出成品 TXT
     ============================================================ */
  function exportFinalTxt() {
    if (!AppState.isEditing || !AppState.currentProjectData) {
      showToast('未加载有效项目');
      return;
    }

    var ori = AppState.currentProjectData.ori;
    var trans = AppState.currentProjectData.trans;
    var meta = AppState.currentProjectData.meta;
    var finalText = '';

    for (var i = 0; i < ori.length; i++) {
      finalText += ori[i] + '\n';
      finalText += (trans[i] || '') + '\n\n';
    }

    var filename = safeFilename(meta.title) + '-' + safeFilename(meta.artist) + '.txt';
    downloadFile(filename, finalText, 'text/plain;charset=utf-8');
    showToast('成品 TXT 导出成功');
  }

  /* ============================================================
     逐行参考翻译
     ============================================================ */
  function translateLine(index) {
    var project = AppState.currentProjectData;
    if (!project) return;

    var originalText = project.ori[index];
    if (!originalText || !originalText.trim()) {
      showToast('原文为空，无法翻译');
      return;
    }

    var fromLang = LANG_MAP[project.meta.orilang] || 'auto';
    var toLang = LANG_MAP[project.meta.translang] || 'zh-CN';

    var refEl = document.querySelector('.reference-trans[data-index="' + index + '"]');
    if (!refEl) return;

    refEl.textContent = '翻译中…';
    refEl.style.display = 'block';

    fetch('https://api.mymemory.translated.net/get?q=' +
          encodeURIComponent(originalText) +
          '&langpair=' + fromLang + '|' + toLang)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.responseStatus === 200 && data.responseData && data.responseData.translatedText) {
          refEl.textContent = data.responseData.translatedText;
        } else {
          refEl.textContent = '翻译失败';
          showToast('参考翻译失败，请重试');
        }
      })
      .catch(function (err) {
        refEl.textContent = '网络错误';
        showToast('网络异常，翻译失败');
        console.error('翻译API错误:', err);
      });
  }

  /* ============================================================
     项目列表渲染
     ============================================================ */
  function renderProjectsGrid(containerId, prefix, isTrash) {
    var container = document.getElementById(containerId);
    var emptyState = document.getElementById(isTrash ? 'trash-empty' : 'home-empty');
    var countEl = document.getElementById(isTrash ? 'trash-count' : 'home-count');
    if (!container) return;

    var projects = getAllProjects(prefix);

    container.innerHTML = '';
    AppState.selectedItems.clear();
    updateBatchActions();

    if (countEl) countEl.textContent = projects.length + ' 个项目';

    if (projects.length === 0) {
      if (emptyState) emptyState.style.display = 'flex';
      return;
    }
    if (emptyState) emptyState.style.display = 'none';

    projects.forEach(function (project) {
      var card = document.createElement('div');
      card.className = 'project-card';
      card.dataset.key = project.key;
      card.innerHTML =
        '<label class="card-check">' +
          '<input type="checkbox" class="project-checkbox" data-key="' + project.key + '" />' +
          '<span class="box"><i class="fas fa-check"></i></span>' +
        '</label>' +
        '<div class="project-title">' + escapeHtml(project.data.meta.title) + '</div>' +
        '<div class="project-sub">' + escapeHtml(project.data.meta.artist) +
          ' · ' + escapeHtml(project.data.meta.orilang) +
          ' → ' + escapeHtml(project.data.meta.translang) + '</div>' +
        '<div class="project-preview">' + escapeHtml(project.data.ori[0] || '') + '</div>';
      container.appendChild(card);
    });

    container.querySelectorAll('.project-card').forEach(function (card) {
      var key = card.dataset.key;
      var checkbox = card.querySelector('.project-checkbox');

      card.addEventListener('click', function (e) {
        if (e.target.closest('.card-check')) return;
        if (!isTrash) openEditor(key);
      });

      checkbox.addEventListener('change', function () {
        if (checkbox.checked) {
          AppState.selectedItems.add(key);
        } else {
          AppState.selectedItems.delete(key);
        }
        card.classList.toggle('selected', checkbox.checked);
        updateBatchActions();
      });
    });
  }

  /* ============================================================
     批量操作栏
     ============================================================ */
  function updateBatchActions() {
    var bar = document.getElementById('batch-actions');
    if (!bar) return;

    var n = AppState.selectedItems.size;
    var isTrash = AppState.currentTab === 'trash';

    // 选中时隐藏悬浮按钮，避免与批量栏重叠
    var fab = document.getElementById('fab-container');
    if (fab && AppState.currentTab === 'home') {
      fab.style.display = n === 0 ? 'flex' : 'none';
    }

    if (n === 0) {
      bar.classList.remove('show');
      bar.innerHTML = '';
      return;
    }

    var html = '<span class="batch-count">已选择 ' + n + ' 项</span>';
    html += '<button type="button" class="batch-btn" data-act="cancel">取消</button>';

    if (isTrash) {
      html += '<button type="button" class="batch-btn" data-act="restore"><i class="fas fa-rotate-left"></i>还原</button>';
      html += '<button type="button" class="batch-btn danger" data-act="delete"><i class="fas fa-trash-can"></i>彻底删除</button>';
    } else {
      html += '<button type="button" class="batch-btn" data-act="export"><i class="fas fa-download"></i>导出</button>';
      html += '<button type="button" class="batch-btn danger" data-act="trash"><i class="fas fa-trash-can"></i>移至回收站</button>';
    }

    bar.innerHTML = html;
    bar.classList.add('show');

    bar.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.dataset.act;
        if (act === 'cancel') {
          AppState.selectedItems.clear();
          document.querySelectorAll('.project-checkbox').forEach(function (cb) { cb.checked = false; });
          document.querySelectorAll('.project-card').forEach(function (c) { c.classList.remove('selected'); });
          updateBatchActions();
        } else if (act === 'export') {
          batchExport();
        } else if (act === 'trash') {
          batchMoveToTrash();
        } else if (act === 'restore') {
          batchRestore();
        } else if (act === 'delete') {
          showConfirm('彻底删除', '确定要永久删除选中的项目吗？此操作不可恢复。', batchDelete);
        }
      });
    });
  }

  /* ============================================================
     Tab 切换
     ============================================================ */
  function switchTab(tab) {
    if (AppState.isEditing && tab !== 'edit') {
      if (hasUnsavedChanges()) {
        showConfirm('未保存的修改', '您有未保存的修改，确定要离开吗？', function () {
          doSwitchTab(tab);
        });
        return;
      }
    }
    doSwitchTab(tab);
  }

  function doSwitchTab(tab) {
    if (AppState.currentTab === 'edit') {
      stopAutoSave();
      AppState.isEditing = false;
      AppState.currentProjectKey = null;
      AppState.currentProjectData = null;
      AppState.originalTranslations = null;
    }

    AppState.currentTab = tab;

    document.querySelectorAll('.tab-content').forEach(function (el) {
      el.style.display = 'none';
    });

    var fab = document.getElementById('fab-container');
    var importBtn = document.getElementById('import-btn');
    if (fab) fab.style.display = 'none';
    if (importBtn) importBtn.style.display = 'none';

    if (tab === 'home') {
      document.getElementById('tab-home').style.display = 'block';
      if (fab) fab.style.display = 'flex';
      if (importBtn) importBtn.style.display = '';
      renderProjectsGrid('projects-grid', 'lyric_x_', false);
    } else if (tab === 'trash') {
      document.getElementById('tab-trash').style.display = 'block';
      renderProjectsGrid('trash-grid', 'lyric_d_', true);
    } else if (tab === 'edit') {
      document.getElementById('tab-edit').style.display = 'block';
    }

    document.querySelectorAll('.nav-link[data-tab]').forEach(function (link) {
      link.classList.toggle('active', link.dataset.tab === tab);
    });

    closeDrawer();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ============================================================
     编辑器
     ============================================================ */
  function autoResizeTextarea() {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
  }

  function openEditor(key) {
    var dataStr = localStorage.getItem(key);
    if (!dataStr) {
      showToast('项目不存在');
      return;
    }

    var data;
    try {
      data = JSON.parse(dataStr);
    } catch (e) {
      showToast('项目数据损坏');
      return;
    }

    if (!validateProjectData(data)) {
      showToast('项目数据损坏');
      return;
    }

    AppState.currentProjectKey = key;
    AppState.currentProjectData = data;
    AppState.originalTranslations = data.trans.slice();
    AppState.isEditing = true;

    document.getElementById('edit-title').textContent = data.meta.title;
    document.getElementById('edit-meta').textContent =
      data.meta.artist + ' · ' + data.meta.orilang + ' → ' + data.meta.translang;

    var container = document.getElementById('lyrics-container');
    container.innerHTML = '';

    data.ori.forEach(function (line, index) {
      var lineDiv = document.createElement('div');
      lineDiv.className = 'lyric-line';
      lineDiv.innerHTML =
        '<div class="lyric-original">' +
          '<span class="lyric-text">' + escapeHtml(line) + '</span>' +
          '<button type="button" class="icon-btn small translate-btn" data-index="' + index + '" title="参考翻译">' +
            '<i class="fas fa-language"></i>' +
          '</button>' +
        '</div>' +
        '<div class="reference-trans" data-index="' + index + '"></div>' +
        '<textarea class="translation-input" data-index="' + index + '" rows="1" ' +
          'placeholder="输入译文…">' + escapeHtml(data.trans[index] || '') + '</textarea>';
      container.appendChild(lineDiv);
    });

    container.querySelectorAll('.translation-input').forEach(function (textarea) {
      textarea.addEventListener('input', autoResizeTextarea);
      autoResizeTextarea.call(textarea);
    });

    container.querySelectorAll('.translate-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        translateLine(parseInt(btn.dataset.index, 10));
      });
    });

    document.getElementById('toggle-original').checked = true;
    toggleOriginalVisibility();

    switchTab('edit');
    startAutoSave();
  }

  function collectTranslations() {
    var trans = [];
    document.querySelectorAll('.translation-input').forEach(function (input) {
      trans.push(input.value || '');
    });
    return trans;
  }

  function hasUnsavedChanges() {
    if (!AppState.isEditing) return false;
    return JSON.stringify(collectTranslations()) !== JSON.stringify(AppState.originalTranslations);
  }

  function saveProjectManual() {
    if (!AppState.isEditing) return;

    var trans = collectTranslations();
    if (trans.length !== AppState.currentProjectData.ori.length) {
      showToast('翻译行数不匹配');
      return;
    }

    AppState.currentProjectData.trans = trans;
    if (saveProject(AppState.currentProjectKey, AppState.currentProjectData)) {
      AppState.originalTranslations = trans.slice();
      showToast('已手动保存');
    }
  }

  function saveProjectAuto() {
    if (!AppState.isEditing) return;

    var trans = collectTranslations();
    if (trans.length !== AppState.currentProjectData.ori.length) return;

    AppState.currentProjectData.trans = trans;
    if (saveProject(AppState.currentProjectKey, AppState.currentProjectData)) {
      AppState.originalTranslations = trans.slice();
      showToast('已自动保存', 1600);
    }
  }

  function startAutoSave() {
    stopAutoSave();
    AppState.autoSaveTimer = setInterval(saveProjectAuto, 60000);
  }

  function stopAutoSave() {
    if (AppState.autoSaveTimer) {
      clearInterval(AppState.autoSaveTimer);
      AppState.autoSaveTimer = null;
    }
  }

  /* ============================================================
     批量操作
     ============================================================ */
  function batchMoveToTrash() {
    var total = AppState.selectedItems.size;
    AppState.selectedItems.forEach(function (key) {
      moveProject(key, 'lyric_d');
    });
    showToast('已将 ' + total + ' 个项目移至回收站');
    renderProjectsGrid('projects-grid', 'lyric_x_', false);
  }

  function batchExport() {
    var keys = Array.from(AppState.selectedItems);
    if (keys.length === 1) {
      var data = JSON.parse(localStorage.getItem(keys[0]));
      downloadFile(safeFilename(data.meta.title) + '-' + safeFilename(data.meta.artist) + '.json',
                   JSON.stringify(data, null, 2));
    } else {
      keys.forEach(function (key, index) {
        setTimeout(function () {
          var d = JSON.parse(localStorage.getItem(key));
          if (!d) return;
          downloadFile(safeFilename(d.meta.title) + '-' + safeFilename(d.meta.artist) + '.json',
                       JSON.stringify(d, null, 2));
        }, index * 500);
      });
    }
    showToast('开始下载');
  }

  function batchRestore() {
    var total = AppState.selectedItems.size;
    AppState.selectedItems.forEach(function (key) {
      moveProject(key, 'lyric_x');
    });
    showToast('已还原 ' + total + ' 个项目');
    renderProjectsGrid('trash-grid', 'lyric_d_', true);
  }

  function batchDelete() {
    var total = AppState.selectedItems.size;
    AppState.selectedItems.forEach(function (key) {
      localStorage.removeItem(key);
    });
    showToast('已永久删除 ' + total + ' 个项目');
    renderProjectsGrid('trash-grid', 'lyric_d_', true);
  }

  /* ============================================================
     新建项目
     ============================================================ */
  function createProject() {
    var title = document.getElementById('new-title').value.trim();
    var artist = document.getElementById('new-artist').value.trim();
    var orilang = document.getElementById('new-orilang').value;
    var translang = document.getElementById('new-translang').value;
    var lyricsText = document.getElementById('new-lyrics').value.trim();

    if (!title || !artist || !orilang || !translang || !lyricsText) {
      showToast('请填写所有必填项');
      return;
    }

    var ori = lyricsText.split('\n').map(function (line) { return line.trimEnd(); });
    var trans = ori.map(function () { return ''; });

    var project = {
      meta: { title: title, artist: artist, orilang: orilang, translang: translang },
      ori: ori,
      trans: trans
    };

    var key = 'lyric_x_' + generateTimestamp();
    if (!saveProject(key, project)) return;

    closeModal('new-project-modal');
    resetNewProjectForm();
    showToast('项目创建成功');
    renderProjectsGrid('projects-grid', 'lyric_x_', false);

    setTimeout(function () { openEditor(key); }, 260);
  }

  function resetNewProjectForm() {
    document.getElementById('new-project-form').reset();
    var ta = document.getElementById('new-lyrics');
    ta.style.height = '';
    document.getElementById('new-title').value = '';
    document.getElementById('new-artist').value = '';
    document.getElementById('new-orilang').value = '';
    document.getElementById('new-translang').value = '';
  }

  /* ============================================================
     导入项目
     ============================================================ */
  function importProject(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var data;
      try {
        data = JSON.parse(e.target.result);
      } catch (err) {
        showToast('文件解析失败');
        return;
      }
      if (!validateProjectData(data)) {
        showToast('文件格式不正确');
        return;
      }
      var key = 'lyric_x_' + generateTimestamp();
      if (saveProject(key, data)) {
        showToast('项目导入成功');
        renderProjectsGrid('projects-grid', 'lyric_x_', false);
      }
    };
    reader.readAsText(file);
  }

  /* ============================================================
     初始化
     ============================================================ */
  document.addEventListener('DOMContentLoaded', function () {

    /* ---- 主题 ---- */
    var themeToggle = document.getElementById('themeToggle');
    var themeIcon = themeToggle ? themeToggle.querySelector('i') : null;

    function syncThemeIcon() {
      if (!themeIcon) return;
      themeIcon.className = document.documentElement.classList.contains('dark')
        ? 'fas fa-sun' : 'fas fa-moon';
    }
    syncThemeIcon();

    if (themeToggle) {
      themeToggle.addEventListener('click', function () {
        document.documentElement.classList.toggle('dark');
        try {
          localStorage.setItem('ltt-theme',
            document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        } catch (e) {}
        syncThemeIcon();
      });
    }

    /* ---- 抽屉 ---- */
    var menuBtn = document.getElementById('menuBtn');
    var drawerClose = document.getElementById('drawerClose');
    var drawerMask = document.getElementById('drawerMask');

    if (menuBtn) menuBtn.addEventListener('click', openDrawer);
    if (drawerClose) drawerClose.addEventListener('click', closeDrawer);
    if (drawerMask) drawerMask.addEventListener('click', closeDrawer);

    /* ---- 导航链接 ---- */
    document.querySelectorAll('.nav-link[data-tab]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        switchTab(link.dataset.tab);
      });
    });

    /* ---- 对话框关闭 ---- */
    document.querySelectorAll('[data-close]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        closeModal(btn.dataset.close);
      });
    });

    document.querySelectorAll('.modal-backdrop').forEach(function (backdrop) {
      backdrop.addEventListener('click', function (e) {
        if (e.target === backdrop) closeModal(backdrop.id);
      });
    });

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.modal-backdrop.open').forEach(function (m) {
        closeModal(m.id);
      });
      if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
    });

    /* ---- 确认对话框 ---- */
    document.getElementById('confirm-ok').addEventListener('click', function () {
      closeModal('confirm-modal');
      var cb = confirmCallback;
      confirmCallback = null;
      if (typeof cb === 'function') cb();
    });

    /* ---- 新建项目 ---- */
    document.getElementById('new-project-btn').addEventListener('click', function () {
      openModal('new-project-modal');
      var ta = document.getElementById('new-lyrics');
      setTimeout(function () { ta.focus(); }, 120);
    });

    document.getElementById('new-project-submit').addEventListener('click', createProject);

    var newLyrics = document.getElementById('new-lyrics');
    newLyrics.addEventListener('input', autoResizeTextarea);

    /* ---- 导入 ---- */
    var fileInput = document.getElementById('file-input');
    document.getElementById('import-btn').addEventListener('click', function () {
      fileInput.click();
    });
    fileInput.addEventListener('change', function (e) {
      if (e.target.files && e.target.files.length > 0) {
        importProject(e.target.files[0]);
        e.target.value = '';
      }
    });

    /* ---- 编辑器按钮 ---- */
    document.getElementById('edit-save').addEventListener('click', saveProjectManual);
    document.getElementById('edit-back').addEventListener('click', function () {
      switchTab('home');
    });
    document.getElementById('toggle-original').addEventListener('change', toggleOriginalVisibility);
    document.getElementById('export-txt').addEventListener('click', exportFinalTxt);

    /* ---- 初始渲染 ---- */
    renderProjectsGrid('projects-grid', 'lyric_x_', false);
    document.getElementById('fab-container').style.display = 'flex';
    document.getElementById('import-btn').style.display = '';
  });

  /* ---- 无痕模式检测 ---- */
  (function checkPrivateMode() {
    var testKey = 'test_private_mode';
    try {
      localStorage.setItem(testKey, testKey);
      localStorage.removeItem(testKey);
    } catch (e) {
      showToast('您处于无痕模式，数据将无法保存', 5000);
    }
  })();

})();
</script>
</body>
</html>
